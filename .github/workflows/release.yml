name: Release files

# When a release is published on GitHub: builds the mod (once per Minecraft version) and the command-line app from the
# release's tag, labelled with its version (a tag "v1.01" gives 1.01), runs every test including each version's
# in-game test, and only then attaches jriks-seed-finder-mod-<version>-mc26.3.jar,
# jriks-seed-finder-mod-<version>-mc1.21.11.jar and seedfinder.jar to the release. Each mod jar is the one its own
# version's tests and in-game test ran on. If anything fails, nothing is attached; "Re-run all jobs" on the run tries
# again.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Read the version from the release's tag
        id: read
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#[vV]}"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::The release's tag \"$TAG\" is not a version such as 1.01 or v1.01."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The command-line app, with every test of the project (the engine, the app, and each version's mod with the
  # no-network guard).
  app:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build -Pversion="$VERSION"

      - uses: actions/upload-artifact@v5
        with:
          name: release-app
          path: cli/build/libs/seedfinder.jar
          if-no-files-found: error

  # The mod for one Minecraft version: its tests (the no-network guard scans the jar that ships), then the in-game test
  # with that same jar.
  mod:
    name: mod (Minecraft ${{ matrix.minecraft }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.3", "1.21.11"]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MINECRAFT: ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew ":mod-$MINECRAFT:build" -Pversion="$VERSION"

      - name: Cache Minecraft's assets
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/fabric-loom/assets
          key: minecraft-assets-${{ matrix.minecraft }}

      - name: Run the in-game test
        run: xvfb-run -a -s "-screen 0 1280x800x24" ./gradlew ":mod-$MINECRAFT:runProductionClientGameTest" -Pversion="$VERSION"

      - name: Upload the in-game test's screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: in-game-test-screenshots-mc${{ matrix.minecraft }}
          path: mod/versions/${{ matrix.minecraft }}/build/run/productionClientGameTest/screenshots/
          if-no-files-found: ignore

      - name: Collect the mod jar for the release
        run: |
          mkdir release-files
          cp "mod/versions/$MINECRAFT/build/libs/jriks-seed-finder-mod-$VERSION-mc$MINECRAFT.jar" release-files/

      - uses: actions/upload-artifact@v5
        with:
          name: release-mod-mc${{ matrix.minecraft }}
          path: release-files/
          if-no-files-found: error

  # A separate job, so the permission to change the release is never given to the builds (Gradle and its plugins). It
  # runs only when the app and the mod for every Minecraft version passed.
  attach:
    needs: [app, mod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files

      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l release-files
          gh release upload "$TAG" release-files/* --clobber --repo "$GITHUB_REPOSITORY"
