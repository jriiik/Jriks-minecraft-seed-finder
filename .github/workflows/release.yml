name: Release files

# When a release is published on GitHub: builds the mod and the command-line app from the release's tag, labelled
# with its version (a tag "v1.01" gives 1.01), runs every test including the in-game test, and only then attaches
# jriks-seed-finder-mod-<version>.jar and seedfinder.jar to the release. A failed run attaches nothing; "Re-run all
# jobs" on it tries again.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Read the version from the release's tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#[vV]}"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::The release's tag \"$TAG\" is not a version such as 1.01 or v1.01."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build -Pversion="$VERSION"

      - name: Cache Minecraft's assets
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/fabric-loom/assets
          key: minecraft-assets-26.3

      - name: Run the in-game test
        run: xvfb-run -a -s "-screen 0 1280x800x24" ./gradlew :mod:runProductionClientGameTest -Pversion="$VERSION"

      - name: Upload the in-game test's screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: in-game-test-screenshots
          path: mod/build/run/productionClientGameTest/screenshots/
          if-no-files-found: ignore

      - name: Collect the files for the release
        run: |
          mkdir release-files
          cp "mod/build/libs/jriks-seed-finder-mod-$VERSION.jar" cli/build/libs/seedfinder.jar release-files/

      - uses: actions/upload-artifact@v5
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error

  # A separate job, so the permission to change the release is never given to the build (Gradle and its plugins).
  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-files
          path: release-files

      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release-files/* --clobber --repo "$GITHUB_REPOSITORY"
