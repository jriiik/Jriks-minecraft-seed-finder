name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Building needs Java 25 (Minecraft 26.x and its mod tools); the command-line app itself still runs on Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build

      - name: Upload the command-line app
        uses: actions/upload-artifact@v5
        with:
          name: seedfinder
          path: cli/build/libs/seedfinder.jar
          if-no-files-found: error

      - name: Upload the Minecraft mod
        uses: actions/upload-artifact@v5
        with:
          name: jriks-seed-finder-mod
          path: |
            mod/build/libs/jriks-seed-finder-mod-*.jar
            !mod/build/libs/*-sources.jar
            !mod/build/libs/*-gametest.jar
          if-no-files-found: error

  # Starts the real Minecraft 26.3 client on a virtual display and uses the mod like a player: switch collecting on,
  # /locate a few structures, and check that the mod finds the seed and that nothing is noted while it is off.
  in-game-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Cache Minecraft's assets
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/fabric-loom/assets
          key: minecraft-assets-26.3

      - name: Run the in-game test
        run: xvfb-run -a -s "-screen 0 1280x800x24" ./gradlew :mod:runProductionClientGameTest

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: in-game-test-screenshots
          path: mod/build/run/productionClientGameTest/screenshots/
          if-no-files-found: ignore
