[versions]
gson = "2.14.0"
picocli = "4.7.7"
junit = "6.1.3"
fabric-loader = "0.19.5"
fabric-loom = "1.18.4"
errorprone-annotations = "2.48.0"
# The Minecraft versions the mod is built for (one Gradle project each: :mod-26.3 and :mod-1.21.11), each with the
# Fabric API made for it.
minecraft-26-3 = "26.3"
fabric-api-26-3 = "0.162.0+26.3"
minecraft-1-21-11 = "1.21.11"
fabric-api-1-21-11 = "0.141.6+1.21.11"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
minecraft-26-3 = { module = "com.mojang:minecraft", version.ref = "minecraft-26-3" }
minecraft-1-21-11 = { module = "com.mojang:minecraft", version.ref = "minecraft-1-21-11" }
# The whole Fabric API, only for the in-game tests (a player's install has it; the mod itself uses a few modules).
fabric-api-26-3 = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api-26-3" }
fabric-api-1-21-11 = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api-1-21-11" }
# Gson 2.14.0 (shipped by Minecraft) carries @InlineMe annotations; javac -Xlint:classfile warns unless this is on the compile classpath.
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone-annotations" }

[plugins]
# Loom, the Gradle plugin for Fabric mods. Minecraft 26.x comes with its own names; older versions are obfuscated, and
# the "remap" variant (the same plugin) turns the mod's names into the ones the game runs with.
loom-unobfuscated = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
loom-remap = { id = "net.fabricmc.fabric-loom-remap", version.ref = "fabric-loom" }
