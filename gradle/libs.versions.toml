[versions]
gson = "2.14.0"
picocli = "4.7.7"
junit = "6.1.3"
minecraft = "26.3"
fabric-loader = "0.19.5"
fabric-api = "0.162.0+26.3"
fabric-loom = "1.18.4"
errorprone-annotations = "2.48.0"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
# The whole Fabric API, only for the in-game tests (a player's install has it; the mod itself uses a few modules).
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
# Gson 2.14.0 (shipped by Minecraft) carries @InlineMe annotations; javac -Xlint:classfile warns unless this is on the compile classpath.
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone-annotations" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
